[project]
name = "warden-detector"
version = "0.1.0"
description = "Learned prompt-injection detector for Agent Warden's scan layer"
requires-python = ">=3.13"
dependencies = [
  "torch==2.11.0",
  "transformers==4.57.1",
  "datasets==4.4.1",
  "scikit-learn==1.7.2",
  "sentence-transformers==5.1.2",
  "fastapi==0.121.1",
  "uvicorn==0.38.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.4"]

[tool.uv]
package = false
